# MegaLinter workflow customized for Uptime-Watcher
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: MegaLinter

on:
    push:
        paths-ignore:
            - "**/CHANGELOG.md"
            - "CHANGELOG.md"
    pull_request:
        paths-ignore:
            - "**/CHANGELOG.md"
            - "CHANGELOG.md"
    workflow_dispatch:

permissions: write-all

concurrency:
    group: megalinter-${{ github.ref }}
    cancel-in-progress: false

jobs:
    megalinter:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: .
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
              with:
                  egress-policy: audit

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: MegaLinter
              id: megalinter
              uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLY_FIXES: all
                  APPLY_FIXES_EVENT: all
                  APPLY_FIXES_MODE: pull_request

            # Upload MegaLinter artifacts
            - name: Archive production artifacts
              if: success() || failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: MegaLinter reports
                  path: |
                      megalinter-reports
                      mega-linter.log
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              continue-on-error: true
